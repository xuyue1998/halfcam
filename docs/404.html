<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E0D0C">
  <title>HALF CAM</title>
  <link rel="stylesheet" href="site.css">
  <link rel="icon" href="store/icon/AppIcon-180.png">
  <script>
    (function () {
      try {
        var lang = localStorage.getItem("halfcam.lang");
        if (lang !== "zh" && lang !== "en") {
          lang = String(navigator.language || "en").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
        }
        document.documentElement.lang = lang === "zh" ? "zh-Hans" : "en";
        document.documentElement.setAttribute("data-site-lang", lang);
      } catch (e) {}
    })();
  </script>
</head>
<body>
<main class="wrap">
  <header class="site-header">
    <a class="mark" href="index.html">HALF CAM</a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-set-lang="zh">中文</button>
      <span aria-hidden="true">/</span>
      <button type="button" data-set-lang="en">EN</button>
    </div>
  </header>
  <h1 data-lang="zh">这一页不在。</h1>
  <h1 data-lang="en">This page is not here.</h1>
  <p><a href="index.html"><span data-lang="zh">回到 HALF CAM</span><span data-lang="en">Back to HALF CAM</span></a></p>
</main>
<script src="site.js"></script>
</body>
</html>
